[package]
name = "wickra"
description = "Streaming-first technical analysis library: incremental indicators, drop-in TA-Lib replacement, multi-language."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/wickra"

# Render the docs on docs.rs with every feature enabled.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
wickra-core = { workspace = true }

[features]
default = ["parallel"]
parallel = ["wickra-core/parallel"]

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
wickra-data = { path = "../wickra-data" }
# Only the `fetch_btcusdt` example parses Binance REST JSON; a dev-dependency
# never reaches a downstream consumer's dependency tree.
serde_json = "1"

[[bench]]
name = "indicators"
harness = false
