# OSV-Scanner suppressions (VEX record). Consumed by the OpenSSF Scorecard
# Vulnerabilities check, which runs OSV-Scanner over this repository. Each entry
# is an advisory assessed as not affecting Wickra; this mirrors the cargo-deny
# `ignore` list in deny.toml at the OSV layer. See the "Vulnerability
# exploitability (VEX)" section of SECURITY.md.

# jackson-core 3.x async-parser DoS — tools.jackson.core:jackson-core 3.x is not
# a dependency of this project. No manifest, Maven plugin, or the GitHub
# dependency-graph SBOM references jackson 3.x; the only jackson present is
# com.fasterxml.jackson.core:jackson-databind 2.17.1 (examples only). Not affected.
[[IgnoredVulns]]
id = "GHSA-72hv-8253-57qq"
reason = "tools.jackson.core:jackson-core 3.x is not a dependency of this project; only jackson-databind 2.17.1 is present. Not affected."

# pytest tmpdir handling (CVSS 6.8, fixed in pytest 9.0.3) -- pytest through
# 9.0.2 on UNIX uses predictable /tmp/pytest-of-{user} directories, which a
# *second local user on the same machine* can abuse for denial of service or
# possibly privilege escalation. Two reasons that does not apply here. pytest is
# a test dependency: it is in .github/requirements/, never in a published wheel,
# so no user of Wickra ever runs it. And it runs only on GitHub-hosted runners,
# each a fresh single-user VM with no second local user to exploit it.
#
# It cannot simply be upgraded either: pytest 9 requires Python >= 3.10, while
# ci-dev-py39.txt exists to test the Python 3.9 row of the matrix. Removing the
# exposure means dropping Python 3.9 support, which is a decision about who can
# install Wickra, not about this advisory. It resolves itself when 3.9 goes.
[[IgnoredVulns]]
id = "GHSA-6w46-j5rx-g56g"
reason = "pytest is a CI-only test dependency, never shipped; the flaw needs a second local user, which a single-user ephemeral runner does not have. Pinned at 8.4.2 because pytest 9 requires Python >= 3.10 and the 3.9 matrix row needs it."

# Go stdlib advisories against the `go` directive. osv-scanner reads the version
# in a go.mod as the standard library in use and reports every advisory fixed
# after it -- 90 of them at the time of writing, all against `stdlib 1.23.99`.
#
# For an application that is the right reading. For a library it is not: the
# directive is a *minimum* language version, and whoever imports the module
# builds it with their own toolchain. Nothing in this repository ships a Go
# binary. CI builds with `stable`, and release.yml assembles and compiles the
# wickra-go mirror with `stable` as well, so no artefact produced here is linked
# against a 1.23 standard library.
#
# The alternative is to raise the directive, which forces every consumer of the
# Go binding onto that toolchain. That is a compatibility decision about who can
# use the module, not a fix for anything this repository builds -- so it is left
# as a decision rather than taken silently here.
[[PackageOverrides]]
ecosystem = "Go"
name = "stdlib"
ignore = true
reason = "The `go` directive is a minimum language version, not the toolchain in use. CI and the release workflow build with `stable`; no artefact here links a 1.23 standard library."
